name: Build & Release Нота

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Verify build output
        shell: bash
        run: |
          echo "Files in release directory:"
          ls -la release/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Нота ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }} — Windows Установщик"
          body: "Скачайте установщик Noto-Setup-1.0.0.exe для быстрой установки приложения Нота на компьютер Windows."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
