name: Build & Release Noto

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @supabase/supabase-js@^2.117.3
          node -e "const fs = require('fs'); const targets = ['node_modules/@tailwindcss/node/node_modules/lightningcss', 'node_modules/lightningcss']; const src = 'node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node'; targets.forEach(t => { if (fs.existsSync(t) && fs.existsSync(src)) { fs.copyFileSync(src, t + '/lightningcss.win32-x64-msvc.node'); console.log('Copied win32 node binary to ' + t); } });"

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Ensure Windows icons exist
        shell: bash
        run: |
          mkdir -p build
          if [ ! -f "build/icon.ico" ] && [ -f "public/favicon.ico" ]; then
            cp public/favicon.ico build/icon.ico
          fi
          if [ ! -f "build/icon.png" ] && [ -f "public/icon.png" ]; then
            cp public/icon.png build/icon.png
          fi
          ls -la build/

      - name: Build Windows Installer (.exe)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify build output
        shell: bash
        run: |
          echo "Files in release directory:"
          ls -la release/

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noto-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Noto"
          body: |
            ### Релиз приложения Noto для Windows 🖥️
            - Скачайте **Noto-Setup-1.0.0.exe** для установки приложения на компьютер.
            - **Исправлено**: создание новых тетрадей теперь строго сохраняет выбранный раздел («Учёба», «Личное» и др.).
            - **Новая функция**: перенос тетрадей в любой раздел через меню карточки тетради.
            - **Оптимизация**: плавный рендеринг без лагов на ПК и мобильных устройствах, снижение нагрузки на процессор и видеокарту при простое до 0%.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
