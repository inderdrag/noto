name: Build & Release Нота

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Build Windows Executable (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Verify build output
        run: dir release

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          gh release create "$TAG_NAME" release/*.exe --title "Нота $TAG_NAME — Windows Установщик" --notes "Скачайте установочный файл Noto-Setup-1.0.0.exe для установки на рабочий стол и в меню Пуск, либо Noto-Portable-1.0.0.exe для запуска без установки." --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
