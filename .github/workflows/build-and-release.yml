name: Build & Release Нота

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @rolldown/binding-win32-x64-msvc

      - name: Build web application
        run: npm run build

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Verify build output
        shell: bash
        run: |
          echo "Files in release directory:"
          ls -lh release/

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading installer..."
            gh release upload "$TAG" release/*.exe --clobber
          else
            echo "Creating release $TAG with installer..."
            gh release create "$TAG" release/*.exe --title "Нота $TAG — Windows Установщик" --notes "Скачайте Noto-Setup-1.0.0.exe для установки приложения Нота на компьютер Windows." --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
